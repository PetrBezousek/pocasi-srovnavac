name: Sběr předpovědí

on:
  schedule:
    # Každé 3 hodiny v 17. minutě (UTC). ČHMÚ nahrává data kolem 2. minuty po celé.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stáhnout předpovědi a měření
        env:
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          WEATHERAPI_API_KEY: ${{ secrets.WEATHERAPI_API_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
        run: python collect.py

      - name: Vyhodnotit přesnost
        run: python evaluate.py

      - name: Uložit data do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/results.json
          git diff --cached --quiet || git commit -m "Data $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --quiet
          git push
